name: Berenjak watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: berenjak-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Berenjak
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python berenjak_watcher.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain berenjak_state.json)" ]; then
            git config user.name  "berenjak-bot"
            git config user.email "berenjak-bot@users.noreply.github.com"
            git add berenjak_state.json
            git commit -m "update berenjak state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi
